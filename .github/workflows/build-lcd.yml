name: Build S3 LCD firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: s3-lcd
            board: pocket-dongle-s3
            bin_path: build/lcd/s3/esp32-arduino.s3.merged.bin
          - target: s3-tdongle
            board: tdongle-s3
            bin_path: build/tdongle-s3/s3/esp32-arduino.tdongle-s3.merged.bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: arduino/setup-arduino-cli@v2
      - name: Install deps
        run: |
          sed -i 's/\r$//' *.sh Makefile
          chmod +x *.sh
          ./install-deps.sh
      - name: Build mklittlefs if needed
        run: |
          if [ ! -x mklittlefs/mklittlefs ]; then
            make -C mklittlefs -j"$(nproc)"
          fi
      - name: Build ${{ matrix.board }}
        run: make ${{ matrix.target }}
      - name: Rename output
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || tag="dev-${GITHUB_SHA::7}"
          cp "${{ matrix.bin_path }}" "dist/esp32-arduino.${{ matrix.board }}-${tag}.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: dist/*.bin
      - name: Stash binary for release job
        uses: actions/upload-artifact@v4
        with:
          name: release-bins-${{ matrix.board }}
          path: dist/*.bin
          retention-days: 1

  release-tag:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bins-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin

  release-latest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bins-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (main)"
          prerelease: true
          files: dist/*.bin
