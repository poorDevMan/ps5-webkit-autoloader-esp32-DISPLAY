name: Build S3 LCD firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: arduino/setup-arduino-cli@v2
      - name: Install deps
        run: |
          sed -i 's/\r$//' *.sh Makefile
          chmod +x *.sh
          ./install-deps.sh
      - name: Build mklittlefs if needed
        run: |
          if [ ! -x mklittlefs/mklittlefs ]; then
            make -C mklittlefs -j"$(nproc)"
          fi
      - name: Check display build selection
        run: python3 -m unittest discover -s tests -v
      - name: Build
        run: |
          make s3-lcd
          make s3-tdongle
          make s3
      - name: Rename output
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || tag="dev-${GITHUB_SHA::7}"
          cp build/lcd/s3/esp32-arduino.s3.merged.bin "dist/esp32-arduino.s3.merged-lcd-${tag}.bin"
          cp build/tdongle-s3/s3/esp32-arduino.tdongle-s3.merged.bin "dist/esp32-arduino.tdongle-s3.merged-${tag}.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: s3-lcd-firmware
          path: dist/*.bin
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
